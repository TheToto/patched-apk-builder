name: CI
on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Force rebuild of all apps'
        type: boolean
        required: false
        default: false
  schedule:
    - cron: "0 16 * * *"

jobs:
  check:
    permissions: write-all
    runs-on: ubuntu-latest
    outputs:
      SHOULD_BUILD: ${{ steps.check_step.outputs.SHOULD_BUILD }}
      MATRIX_JSON: ${{ steps.check_step.outputs.MATRIX_JSON }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "21"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Retrieve State from Update Branch
        run: |
          git checkout origin/update build-state.json build.md 2>/dev/null || echo "No previous state found on update branch"

      - name: Check for Updates
        id: check_step
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            node dist/index.js check --force
          else
            node dist/index.js check
          fi

      - name: Clear older runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run list -L400 --json databaseId -q '.[].databaseId' | tail -n+10 | xargs -r -IID gh api "repos/$GITHUB_REPOSITORY/actions/runs/ID" -X DELETE 2>/dev/null || true

  build:
    permissions: write-all
    needs: check
    if: ${{ needs.check.outputs.SHOULD_BUILD == '1' }}
    uses: ./.github/workflows/build.yml
    with:
      matrix_json: ${{ needs.check.outputs.MATRIX_JSON }}
    secrets: inherit
