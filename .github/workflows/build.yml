name: Build Modules
on:
  workflow_call:
    inputs:
      matrix_json:
        type: string
        required: false
        default: ''

  workflow_dispatch:
    inputs:
      target_app:
        description: 'Specific app slug to build (leave empty for all)'
        required: false
        default: ''

jobs:
  # When triggered via CI with matrix
  build-matrix:
    if: ${{ inputs.matrix_json != '' && inputs.matrix_json != '{"include":[]}' }}
    permissions: write-all
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(inputs.matrix_json) }}
    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "21"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Dependencies & Build CLI
        run: |
          npm ci
          npm run build

      - name: Retrieve State from Update Branch
        run: |
          git checkout origin/update build-state.json build.md 2>/dev/null || true

      - name: Build Target App
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node dist/index.js build -a "${{ matrix.slug }}" --arch "${{ matrix.arch }}" --app-version "${{ matrix.version }}"

      - name: Upload Built Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.slug }}-${{ matrix.arch }}
          path: |
            build/*.apk
            build/*.zip
            build/*.patches.json
            build/*.png
            build-state.json

  # When triggered manually without matrix
  build-direct:
    if: ${{ inputs.matrix_json == '' || inputs.matrix_json == '{"include":[]}' }}
    permissions: write-all
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "21"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Dependencies & Build CLI
        run: |
          npm ci
          npm run build

      - name: Retrieve State from Update Branch
        run: |
          git checkout origin/update build-state.json build.md 2>/dev/null || true

      - name: Build Apps
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ inputs.target_app }}" ]; then
            node dist/index.js build -a "${{ inputs.target_app }}"
          else
            node dist/index.js build
          fi

      - name: Upload Built Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-direct
          path: |
            build/*.apk
            build/*.zip
            build/*.patches.json
            build/*.png
            build-state.json

  # Deployment, Releases, Web and Notifications
  deploy:
    needs: [build-matrix, build-direct]
    if: always() && (needs.build-matrix.result == 'success' || needs.build-direct.result == 'success')
    permissions: write-all
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Dependencies & Build CLI
        run: |
          npm ci
          npm run build

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded-artifacts

      - name: Consolidate Artifacts
        run: |
          mkdir -p build
          find downloaded-artifacts -type f \( -name "*.apk" -o -name "*.zip" -o -name "*.patches.json" -o -name "*.png" \) -exec cp -f {} build/ \;
          find downloaded-artifacts -type f -name "build-state.json" -exec cp -f {} . \;
          ls -la build/

      - name: Determine Next Version Tag
        id: next_ver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=$(gh release list -L 1 | awk -F '\t' '{print $3}')
          if [ -z "$TAG" ]; then TAG=0; fi
          echo "NEXT_VER_CODE=$((TAG + 1))" >> $GITHUB_OUTPUT

      - name: Create or Update GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.next_ver.outputs.NEXT_VER_CODE }}
        run: |
          shopt -s nullglob
          files=(build/*.apk build/*.zip)
          if [ ${#files[@]} -gt 0 ]; then
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" "${files[@]}" --clobber
            else
              gh release create "$TAG" "${files[@]}" --title "Release v${TAG}" --notes "Automated release build v${TAG}"
            fi
          fi

      - name: Generate Static Web Pages
        env:
          NEXT_VER_CODE: ${{ steps.next_ver.outputs.NEXT_VER_CODE }}
        run: |
          node dist/index.js web --out /tmp/pages

      - name: Commit to Update Branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -f update || git switch --discard-changes --orphan update

          cp -a /tmp/pages/* . 2>/dev/null || true
          [ -f "build-state.json" ] && git add build-state.json
          [ -f "build.md" ] && git add build.md

          git add *.html *.png *.css CNAME *-update.json 2>/dev/null || true

          if ! git diff --cached --quiet; then
            git commit -m "Deploy release v${{ steps.next_ver.outputs.NEXT_VER_CODE }}"
            git push origin HEAD:update
          else
            echo "No changes to commit to update branch"
          fi

      - name: Send Telegram Notification
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          NEXT_VER_CODE: ${{ steps.next_ver.outputs.NEXT_VER_CODE }}
        if: env.TG_TOKEN != null
        run: |
          node dist/index.js notify
