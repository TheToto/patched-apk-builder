name: Build Modules
on:
  workflow_call:
    inputs:
      matrix_json:
        type: string
        required: false
        default: ''

  workflow_dispatch:
    inputs:
      target_app:
        description: 'Specific app slug to build (leave empty for all)'
        required: false
        default: ''

jobs:
  # Determine next version code from latest GitHub release
  prepare:
    runs-on: ubuntu-latest
    outputs:
      NEXT_VER_CODE: ${{ steps.ver.outputs.NEXT_VER_CODE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Next Version Code
        id: ver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RAW_TAG=$(gh release list -R "$GITHUB_REPOSITORY" -L 1 --json tagName -q '.[0].tagName')
          TAG=${RAW_TAG//[^0-9]/}
          if [ -z "$TAG" ]; then TAG=0; fi
          NEXT=$((TAG + 1))
          echo "Determined next version code: $NEXT"
          echo "NEXT_VER_CODE=$NEXT" >> $GITHUB_OUTPUT

  # When triggered via CI with matrix
  build-matrix:
    needs: prepare
    if: ${{ inputs.matrix_json != '' && inputs.matrix_json != '{"include":[]}' }}
    permissions: write-all
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(inputs.matrix_json) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "21"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Dependencies & Build CLI
        run: |
          npm ci
          npm run build

      - name: Retrieve State from Update Branch
        run: |
          git checkout origin/update -- build-state.json 2>/dev/null || true
          git checkout origin/update -- build.md 2>/dev/null || true

      - name: Build Target App
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT_VER_CODE: ${{ needs.prepare.outputs.NEXT_VER_CODE }}
        run: |
          node dist/index.js build -a "${{ matrix.slug }}" --arch "${{ matrix.arch }}" --app-version "${{ matrix.version }}"

      - name: Upload Built Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.slug }}-${{ matrix.arch }}
          path: |
            build/*.apk
            build/*.zip
            build/*.patches.json
            build/*.png
            build-state.json
            build.md

  # When triggered manually without matrix
  build-direct:
    needs: prepare
    if: ${{ inputs.matrix_json == '' || inputs.matrix_json == '{"include":[]}' }}
    permissions: write-all
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "21"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Dependencies & Build CLI
        run: |
          npm ci
          npm run build

      - name: Retrieve State from Update Branch
        run: |
          git checkout origin/update -- build-state.json 2>/dev/null || true
          git checkout origin/update -- build.md 2>/dev/null || true

      - name: Build Apps
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT_VER_CODE: ${{ needs.prepare.outputs.NEXT_VER_CODE }}
        run: |
          if [ -n "${{ inputs.target_app }}" ]; then
            node dist/index.js build -a "${{ inputs.target_app }}"
          else
            node dist/index.js build
          fi

      - name: Upload Built Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-direct
          path: |
            build/*.apk
            build/*.zip
            build/*.patches.json
            build/*.png
            build-state.json
            build.md

  # Deployment, Releases, Web and Notifications
  deploy:
    needs: [prepare, build-matrix, build-direct]
    if: always() && !cancelled() && (needs.build-matrix.result == 'success' || needs.build-matrix.result == 'failure' || needs.build-direct.result == 'success')
    permissions: write-all
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Dependencies & Build CLI
        run: |
          npm ci
          npm run build

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded-artifacts

      - name: Consolidate Artifacts
        run: |
          mkdir -p build
          find downloaded-artifacts -type f \( -name "*.apk" -o -name "*.zip" -o -name "*.patches.json" -o -name "*.png" \) -exec cp -f {} build/ \;
          node -e "
          const fs = require('fs');
          let merged = fs.existsSync('build-state.json') ? JSON.parse(fs.readFileSync('build-state.json')) : { apps: {}, lastVersionCode: 0 };
          function walk(dir) {
            for (const f of fs.readdirSync(dir, { withFileTypes: true })) {
              const p = dir + '/' + f.name;
              if (f.isDirectory()) walk(p);
              else if (f.name === 'build-state.json') {
                try {
                  const s = JSON.parse(fs.readFileSync(p));
                  merged.apps = { ...merged.apps, ...s.apps };
                  if (s.lastVersionCode > merged.lastVersionCode) merged.lastVersionCode = s.lastVersionCode;
                } catch {}
              }
            }
          }
          if (fs.existsSync('downloaded-artifacts')) walk('downloaded-artifacts');
          fs.writeFileSync('build-state.json', JSON.stringify(merged, null, 2));
          "
          find downloaded-artifacts -type f -name "build.md" -exec cp -f {} . \;
          cp -f build-state.json /tmp/build-state.json 2>/dev/null || true
          cp -f build.md /tmp/build.md 2>/dev/null || true
          ls -la build/

      - name: Create or Update GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.NEXT_VER_CODE }}
        run: |
          shopt -s nullglob
          files=(build/*.apk build/*.zip)
          if [ ${#files[@]} -gt 0 ]; then
            if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release upload "$TAG" "${files[@]}" -R "$GITHUB_REPOSITORY" --clobber
            else
              gh release create "$TAG" "${files[@]}" -R "$GITHUB_REPOSITORY" --title "Release v${TAG}" --notes "Automated release build v${TAG}"
            fi
          fi

      - name: Commit to Update Branch
        env:
          NEXT_VER_CODE: ${{ needs.prepare.outputs.NEXT_VER_CODE }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Preserve existing files on update branch and checkout cleanly
          git checkout -B update origin/update || git switch --discard-changes --orphan update

          # Generate static pages directly into update branch working directory
          node dist/index.js web --out .

          cp -f /tmp/build-state.json build-state.json 2>/dev/null || true
          cp -f /tmp/build.md build.md 2>/dev/null || true
          [ -f "build-state.json" ] && git add build-state.json
          [ -f "build.md" ] && git add build.md

          git add *.html *.png *.css CNAME *-update.json 2>/dev/null || true

          if ! git diff --cached --quiet; then
            git commit -m "Deploy release v${{ needs.prepare.outputs.NEXT_VER_CODE }}"
            git push origin HEAD:update
          else
            echo "No changes to commit to update branch"
          fi
